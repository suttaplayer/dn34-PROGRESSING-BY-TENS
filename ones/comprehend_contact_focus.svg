<svg width="1636" height="1001" viewBox="-0.5 -0.5 1636 1001" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- 1. Define a blur filter -->
    <filter id="blur-filter">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <!-- 2. Define a mask to show only specific areas -->
    <mask id="focus-mask">
      <!-- Start with a black rectangle covering everything, which hides content -->
      <rect x="0" y="0" width="100%" height="100%" fill="black" />
      
      <!-- Use white shapes to "cut holes" in the mask, revealing content -->
      <rect x="1085" y="441" width="195" height="40" rx="16" ry="16" fill="white" />
      <rect x="1334" y="441" width="195" height="40" rx="16" ry="16" fill="white" />
      <rect x="1280" y="458" width="56" height="6" fill="white" />
    </mask>
  </defs>

  <!-- 3. Display the original diagram, blurred, as the background -->
  <image href="../samsara-process.drawio.svg" width="1636" height="1001" filter="url(#blur-filter)"/>

  <!-- 4. Display the original diagram again, un-blurred, but apply the mask -->
  <image href="../samsara-process.drawio.svg" width="1636" height="1001" mask="url(#focus-mask)"/>
</svg>