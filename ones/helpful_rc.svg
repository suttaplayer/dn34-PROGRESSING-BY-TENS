orrect</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="200.0013" x="195.8213" y="322.0821"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.0013" x="205.8213" y="344.9102">seek more admirable friendship</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="131.1088" x="230.2676" y="378.4263"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.1088" x="240.2676" y="401.2544">develops conviction</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="156.321" x="217.6615" y="434.7704"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.321" x="227.6615" y="457.5985">develops non-stinginess</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="132.4888" x="229.5775" y="491.1145"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.4888" x="239.5775" y="513.9426">arouses persistence</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="168.4171" x="211.6134" y="547.4586"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.4171" x="221.6134" y="570.2867">develops non-restlessness</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="121.9527" x="234.8456" y="603.8027"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.9527" x="244.8456" y="626.6308">develops restraint</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="106.2806" x="242.6816" y="660.1468"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86.2806" x="252.6816" y="682.9749">develops virtue</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="210.8014" x="190.4212" y="716.4909"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.8014" x="200.4212" y="739.319">develops desire to see noble ones</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="240.8976" x="175.3732" y="772.8351"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.8976" x="185.3732" y="795.6632">develops desire to hear noble dhamma</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="210.4893" x="190.5773" y="829.1792"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.4893" x="200.5773" y="852.0073">having a mind not bent on critism</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="209.6374" x="191.0033" y="885.5233"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.6374" x="201.0033" y="908.3514">develops mindfulness &amp; alertness</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="204.6453" x="193.4993" y="941.8674"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.6453" x="203.4993" y="964.6955">develops unscattered awareness</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="205.1253" x="193.2593" y="998.2115"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="50.4964" x="203.2593" y="1021.0396">develops</text>