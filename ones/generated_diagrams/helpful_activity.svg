ess</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="539.334" x="274.9316" y="178.4219"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="519.334" x="284.9316" y="199.5605">Perform Recollection Practices (Buddha, Dhamma, Sangha, Virtue, Generosity, Devas)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="443.2578" x="322.9697" y="247.3906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="423.2578" x="332.9697" y="268.5293">Balance Mental Qualities (Concentration, Uplifted Energy, Equanimity)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="817.2656" x="11" y="335.8438"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="265.7012" x="286.7822" y="361.8438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.7012" x="296.7822" y="382.9824">Persist in Abandoning Unskillful Qualities</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="246.7285" x="296.2686" y="415.8125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="226.7285" x="306.2686" y="436.9512">Persist in Developing Skillful Qualities</text><polygon fill="#F1F1F1" points="390.449,469.7813,448.8167,469.7813,460.8167,481.7813,448.8167,493.7813,390.449,493.7813,378.449,481.7813,390.449,469.7813" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="58.3677" x="390.449" y="485.5894">Joy arises?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="359.2312" y="479.187">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.9585" x="460.8167" y="479.187">No</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="107.2578" x="265.5884" y="503.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="87.2578" x="275.5884" y="524.9199">Rapture arises</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="122.8555" x="257.7896" y="557.75"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.8555" x="267.7896" y="578.8887">Body grows calm</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="142.5957" x="247.9194" y="611.7188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.5957" x="257.9194" y="632.8574">Experience pleasure</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="190.6309" x="223.9019" y="665.6875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.6309" x="233.9019" y="686.8262">Mind becomes concentrated</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="97.584" x="471.2563" y="503.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="77.584" x="481.2563" y="524.9199">Dwell in pain</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="121.543" x="459.2769" y="557.75"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.543" x="469.2769" y="578.8887">Mind uncentered</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="171.0313" x="434.5327" y="611.7188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.0313" x="444.5327" y="632.8574">Phenomena not manifest</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="136.2383" x="451.9292" y="665.6875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.2383" x="461.9292" y="686.8262">Reckoned heedless</text><polygon fill="#F1F1F1" points="419.6328,705.6563,431.6328,717.6563,419.6328,729.6563,407.6328,717.6563,419.6328,705.6563" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="293.3281" x="272.9688" y="749.6563"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.3281" x="282.9688" y="770.7949">Discern things as they are (e.g., inconstancy)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="316.7891" x="261.2383" y="803.625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="296.7891" x="271.2383" y="824.7637">Achieve Release / Ending of Effluents / Unbinding</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="142.7422" x="348.2617" y="857.5938"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.7422" x="358.2617" y="878.7324">Attain the Deathless</text><ellipse cx="419.6328" cy="922.5625" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="419.6328" cy="922.5625" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="419.6328" x2="419.6328" y1="30" y2="50"/><polygon fill="#181818" points="415.6328,40,419.6328,50,423.6328,40,4