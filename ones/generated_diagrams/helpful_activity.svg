<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="847px" preserveAspectRatio="none" style="width:2074px;height:847px;background:#FFFFFF;" version="1.1" viewBox="0 0 2074 847" width="2074px" zoomAndPan="magnify"><title>Workflow of Heedfulness with Skillful Qualities</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="371.7793" x="849.6465" y="32.9951">Workflow of Heedfulness with Skillful Qualities</text></g><ellipse cx="1306.0415" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="461.1289" x="1075.4771" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="441.1289" x="1085.4771" y="108.4355">Understand "Heedfulness with regard to skillful qualities" as foundational</text><polygon fill="#F1F1F1" points="1239.2332,141.2656,1372.8499,141.2656,1384.8499,153.2656,1372.8499,165.2656,1239.2332,165.2656,1227.2332,153.2656,1239.2332,141.2656" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="133.6167" x="1239.2332" y="157.0737">Heedfulness Cultivated?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="1208.0154" y="150.6714">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="100.9336" x="1384.8499" y="150.6714">No / Heedlessness</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="236.1992" x="661.9238" y="175.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.1992" x="671.9238" y="196.4043">Actively abandon unskillful qualities</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="472.502" x="543.7725" y="229.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.6133" x="553.7725" y="250.373">Actively cultivate skillful qualities</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="452.502" x="553.7725" y="264.3418">(e.g., good conduct, persistence, mindfulness, concentration, discernment)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="278.1699" x="640.9385" y="311.1406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="258.1699" x="650.9385" y="332.2793">Maintain steadfast effort &amp; not shirk duties</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="229.25" x="665.3984" y="379.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.25" x="675.3984" y="400.2168">Aspire for purity of virtue and view</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="1556.0469" x="11" y="433.0469"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.418" x="23" y="459.0469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.418" x="33" y="480.1855">Develop Four Establishings of Mindfulness</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="325.7598" x="306.418" y="459.0469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="305.7598" x="316.418" y="480.1855">Achieve "Knowing &amp; Seeing" nature of phenomena</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="250.6191" x="660.1777" y="459.0469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.6191" x="670.1777" y="480.1855">Abandon Craving and Action (Kamma)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="131.8262" x="938.7969" y="459.0469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.8262" x="948.7969" y="480.1855">Guard oneself well</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="456.4238" x="1098.623" y="459.0469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="436.4238" x="1108.623" y="480.1855">Support Right View with Virtue, Learning, Discussion, Tranquility, Insight</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="1556.0469" x="11" y="513.0156"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="396.5" x="581.7734" y="554.0156"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="376.5" x="591.7734" y="575.1543">Achieve "Unfabricated" (Ending of passion, aversion, delusion)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="328.5488" x="615.749" y="622.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="308.5488" x="625.749" y="644.123">Attain Awareness-release and Discernment-release</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="168.5117" x="695.7676" y="676.9531"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.5117" x="705.7676" y="698.0918">End Suffering and Stress</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.5391" x="622.7539" y="730.9219"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.5391" x="632.7539" y="752.0605">Realize Unbinding / Ultimate Peace and Freedom</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="247.666" x="1696.2266" y="175.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.666" x="1706.2266" y="196.4043">Mind tends to laziness or restlessness</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="257.3984" x="1691.3604" y="229.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="237.3984" x="1701.3604" y="250.373">Concentration fails to develop correctly</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="244.3613" x="1697.8789" y="297.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.3613" x="1707.8789" y="318.3105">Defilement by passion and ignorance</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="486.0254" x="1577.0469" y="365.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.9258" x="1587.0469" y="386.248">Increase in unskillful qualities</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="466.0254" x="1587.0469" y="400.2168">(e.g., unvirtuous, envious, stingy, ignorance, unskillful thinking, wrong views)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="238.9121" x="1700.6035" y="433.0469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.9121" x="1710.6035" y="454.1855">Actions driven by "unknowing" state</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="351.3887" x="1644.3652" y="502.0156"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="331.3887" x="1654.3652" y="523.1543">Experience Increased Suffering and Undesirable States</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="226.7012" x="1706.709" y="570.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.7012" x="1716.709" y="592.123">Perpetuate Cycle of Wandering-on</text><polygon fill="#F1F1F1" points="1306.0415,770.8906,1318.0415,782.8906,1306.0415,794.8906,1294.0415,782.8906,1306.0415,770.8906" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="1306.0415" cy="825.8906" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1306.0415" cy="825.8906" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1306.0415" x2="1306.0415" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="1302.0415,77.2969,1306.0415,87.2969,1310.0415,77.2969,1306.0415,81.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="780.0234" x2="780.0234" y1="209.2344" y2="229.2344"/><polygon fill="#181818" points="776.0234,219.2344,780.0234,229.2344,784.0234,219.2344,780.0234,223.2344" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="780.0234" x2="780.0234" y1="277.1719" y2="311.1406"/><polygon fill="#181818" points="776.0234,301.1406,780.0234,311.1406,784.0234,301.1406,780.0234,305.1406" style="stroke:#181818;stroke-w