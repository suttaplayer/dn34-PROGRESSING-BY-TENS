<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1476px" preserveAspectRatio="none" style="width:828px;height:1476px;background:#FFFFFF;" version="1.1" viewBox="0 0 828 1476" width="828px" zoomAndPan="magnify"><defs/><g><ellipse cx="341.5469" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="310.0977" x="186.498" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="290.0977" x="196.498" y="71.1387">Desire for heightened mind / Ending of Effluents</text><rect fill="none" height="244.1719" style="stroke:#000000;stroke-width:1.5;" width="661.0938" x="11" y="93.9688"/><path d="M171.6162,93.9688 L171.6162,103.2656 L161.6162,113.2656 L11,113.2656" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.6162" x="14" y="107.9639">Preparatory Practices</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="641.0938" x="21" y="130.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="621.0938" x="31" y="151.4043">Develop Concentration by periodically attending to Concentration, Uplifted Energy, Equanimity themes</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="173.4043" x="254.8447" y="184.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.4043" x="264.8447" y="205.373">Abandon Five Hindrances</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="364.2852" x="159.4043" y="238.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="344.2852" x="169.4043" y="259.3418">Practice Seclusion from sensuality and unskillful qualities</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="349.8359" x="166.6289" y="292.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="329.8359" x="176.6289" y="313.3105">Recollect Three Jewels, Virtues, Devas (Cleanses Mind)</text><rect fill="none" height="361.4458" style="stroke:#000000;stroke-width:1.5;" width="733.8223" x="83.1875" y="348.1406"/><path d="M224.5947,348.1406 L224.5947,357.4375 L214.5947,367.4375 L83.1875,367.4375" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.4072" x="86.1875" y="362.1357">Core Development</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="291.9863" x="195.5537" y="384.4375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.0215" x="205.5537" y="405.5762">Cultivate Four Jhanas</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271.9863" x="205.5537" y="419.5449">(leads to concentrated, purified, bright mind)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="496.7188" x="93.1875" y="452.375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.2051" x="103.1875" y="473.5137">Develop Seven Factors for Awakening</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="476.7188" x="103.1875" y="487.4824">(Mindfulness, Analysis, Persistence, Rapture, Calm, Concentration, Equanimity)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="376.0977" x="153.498" y="541.7114"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="356.0977" x="163.498" y="562.8501">Cultivate Disenchantment/Dispassion with Five Aggregates</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="298.3828" x="163.498" y="576.8188">(by seeing them as inconstant, stressful, not-self)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224.1055" x="229.4941" y="609.6489"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.1055" x="239.4941" y="630.7876">Stop objectification-classifications</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="276.7871" x="203.1533" y="663.6177"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.7871" x="213.1533" y="684.7563">Do not relish feelings (internal or external)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="195.1133" x="243.9902" y="729.5864"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.1133" x="253.9902" y="750.7251">Develop Tranquility &amp; Insight</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="317.9844" x="182.5547" y="783.5552"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="297.9844" x="192.5547" y="804.6938">Achieve Unmediated Concentration of Awareness</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.8184" x="192.5547" y="818.6626">(by not attending to all themes)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="499.8184" x="91.6377" y="851.4927"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="479.8184" x="101.6377" y="872.6313">Consciousness is neither externally scattered/diffused, nor internally positioned</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="371.75" x="155.6719" y="905.4614"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="351.75" x="165.6719" y="926.6001">Achieve Non-agitation (due to lack of clinging/sustenance)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="340.666" x="171.2139" y="959.4302"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="320.666" x="181.2139" y="980.5688">Mind becomes pliant, malleable, luminous, not brittle</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.7754" x="210.6592" y="1013.3989"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.7754" x="220.6592" y="1034.5376">Experience Joy, Rapture, Calm, Pleasure</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.7676" x="253.1631" y="1067.3677"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.7676" x="263.1631" y="1088.5063">Unskillful Thinking Ceases</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.1406" x="265.4766" y="1121.3364"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.1406" x="275.4766" y="1142.4751">Ignorance Abandoned</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="146.5625" x="268.2656" y="1175.3052"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.5625" x="278.2656" y="1196.4438">Clear Knowing Arises</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="209.9023" x="236.5957" y="1229.2739"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.9023" x="246.5957" y="1250.4126">Mind is Released from Effluents</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="153.002" x="265.0459" y="1283.2427"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="133.002" x="275.0459" y="1304.3813">Realization of Release</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="296.7207" x="193.1865" y="1337.2114"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="276.7207" x="203.1865" y="1358.3501">No Seed for Future Birth, Aging, Death, Stress</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183.8809" x="249.6064" y="1391.1802"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.8809" x="259.6064" y="1412.3188">Attain Unbinding (Nibbana)</text><ellipse cx="341.5469" cy="1455.1489" fill="none" rx="10" ry="10" style="stroke:#222222;stroke-width:1.5;"/><line style="stroke:#222222;stroke-width:2.5;" x1="335.3597" x2="347.7341" y1="1448.9617" y2="1461.3361"/><line style="stroke:#222222;stroke-width:2.5;" x1="347.7341" x2="335.3597" y1="1448.9617" y2="1461.3361"/><line style="stroke:#181818;stroke-width:1;" x1="341.5469" x2="341.5469" y1="30" y2="50"/><polygon fill="#181818" points="337.5469,40,341.5469,50,345.5469,40,341.5469,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;s