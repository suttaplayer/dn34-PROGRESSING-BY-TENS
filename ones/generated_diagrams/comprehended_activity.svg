<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1000px" preserveAspectRatio="none" style="width:1027px;height:1000px;background:#FFFFFF;" version="1.1" viewBox="0 0 1027 1000" width="1027px" zoomAndPan="magnify"><title>Transformation from Clinging to Release</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="321.4258" x="351.6416" y="32.9951">Transformation from Clinging to Release</text></g><ellipse cx="476.769" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="298.1406" style="stroke:#000000;stroke-width:1.5;" width="416.5586" x="268.4897" y="77.2969"/><path d="M530.5991,77.2969 L530.5991,86.5938 L520.5991,96.5938 L268.4897,96.5938" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="252.1094" x="271.4897" y="91.292">Starting State: Conditions for Stress</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="396.5586" x="278.4897" y="113.5938"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="376.5586" x="288.4897" y="134.7324">Contact arises (dependent on Six Sense Media, Name-&amp;-Form)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="185.3867" x="384.0757" y="167.5625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.3867" x="394.0757" y="188.7012">Feeling arises from Contact</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="185.0234" x="384.2573" y="221.5313"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.0234" x="394.2573" y="242.6699">Craving arises from Feeling</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="190.291" x="381.6235" y="275.5"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.291" x="391.6235" y="296.6387">Clinging arises from Craving</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="146.0938" x="403.7222" y="329.4688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.0938" x="413.7222" y="350.6074">Effluents are present</text><polygon fill="#F1F1F1" points="323.1235,395.4375,630.4146,395.4375,642.4146,407.4375,630.4146,419.4375,323.1235,419.4375,311.1235,407.4375,323.1235,395.4375" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="307.291" x="323.1235" y="411.2456">Discerns allure, drawbacks, and escape of phenomena?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.9585" x="296.165" y="404.8433">No</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="642.4146" y="404.8433">Yes</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="418.6836" x="11" y="429.4375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="398.6836" x="21" y="450.5762">Relishes, welcomes, or remains fastened to feelings/sense objects</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="355.0801" x="42.8018" y="483.4063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="335.0801" x="52.8018" y="504.5449">Passion, resistance, ignorance obsessions get obsessed</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="184.1445" x="128.2695" y="537.375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.1445" x="138.2695" y="558.5137">Unskillful qualities increase</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.8457" x="105.9189" y="591.3438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.8457" x="115.9189" y="612.4824">Leads to further Suffering &amp; Stress</text><ellipse cx="220.3418" cy="656.3125" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="220.3418" cy="656.3125" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="227.3574" x="619.5176" y="429.4375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.3574" x="629.5176" y="450.5762">Associates with people of integrity</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="144.7578" x="660.8174" y="483.4063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.7578" x="670.8174" y="504.5449">Hears True Dhamma</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="164.3574" x="651.0176" y="537.375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.3574" x="661.0176" y="558.5137">Develops Concentration</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="202.0098" x="632.1914" y="591.3438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.0098" x="642.1914" y="612.4824">Develops Noble Eightfold Path</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="419.791" x="523.3008" y="645.3125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="399.791" x="533.3008" y="666.4512">Focuses on inconstancy, stress, and not-self nature of phenomena</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="251.4512" x="607.4707" y="699.2813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.4512" x="617.4707" y="720.4199">Subdues and abandons desire-passion</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="567.0254" x="449.6836" y="753.25"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="547.0254" x="459.6836" y="774.3887">Abandons passion-obsession, abolishes resistance-obsession, uproots ignorance-obsession</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="281.9199" x="592.2363" y="807.2188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.9199" x="602.2363" y="828.3574">Ignorance abandoned, clear knowing arises</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="247.9121" x="609.2402" y="861.1875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.9121" x="619.2402" y="882.3262">Mind is released through discernment</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="322.2383" x="572.0771" y="915.1563"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="302.2383" x="582.0771" y="936.2949">Attains Unbinding (cessation of suffering &amp; stress)</text><ellipse cx="733.1963" cy="979.125" fill="none" rx="10" ry="10" style="stroke:#222222;stroke-width:1.5;"/><line style="stroke:#222222;stroke-width:2.5;" x1="727.0091" x2="739.3835" y1="972.9378" y2="985.3122"/><line style="stroke:#222222;stroke-width:2.5;" x1="739.3835" x2="727.0091" y1="972.9378" y2="985.3122"/><line style="stroke:#181818;stroke-width:1;" x1="476.769" x2="476.769" y1="147.5625" y2="167.5625"/><polygon fill="#181818" points="472.769,157.5625,476.769,167.5625,480.769,157.5625,476.769,161.5625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="476.769" x2="476.769" y1="201.5313" y2="221.5313"/><polygon fill="#181818" points="472.769,211.5313,476.769,221.5313,480.769,211.5313,476.769,215.5313" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="476.769" x2="476.769" y1="255.5" y2="275.5"/><polygon fill="#181818" points="472.769,265.5,476.769,275.5,480.769,265.5,476.769,269.5" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="476.769" x2="476.769" y1="309.4688" y2="329.4688"/><polygon fill="#181818" points="472.769,319.4688,476.769,329.4688,480.769,319.4688,476.769,323.4688" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="476.769" x2="476.769" y1="67.2969" y2="113.5938"/><polygon fill="#181818" points="472.769,103.5938,476.769,113.5938,480.769,103.5938,476.769,107.5938" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="220.3418" x2="220.3418" y1="463.4063" y2="483.4063"/><polygon fill="#181818" points="216.3418,473.4063,220.3418,483.4063,224.3418,473.4063,220.3418,477.4063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="220.3418" x2="220.3418" y1="517.375" y2="537.375"/><polygon fill="