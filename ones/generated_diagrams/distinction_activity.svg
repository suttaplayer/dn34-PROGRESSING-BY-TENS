<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="866px" preserveAspectRatio="none" style="width:789px;height:866px;background:#FFFFFF;" version="1.1" viewBox="0 0 789 866" width="789px" zoomAndPan="magnify"><title>Workflow of Appropriate Attention Leading to Release</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="430.0146" x="178.0039" y="32.9951">Workflow of Appropriate Attention Leading to Release</text></g><ellipse cx="197.3701" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M403.7402,84.1484 L403.7402,100.2813 L383.7402,104.2813 L403.7402,108.2813 L403.7402,124.4141 A0,0 0 0 0 403.7402,124.4141 L777.0225,124.4141 A0,0 0 0 0 777.0225,124.4141 L777.0225,94.1484 L767.0225,84.1484 L403.7402,84.1484 A0,0 0 0 0 403.7402,84.1484" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M767.0225,84.1484 L767.0225,94.1484 L777.0225,94.1484 L767.0225,84.1484" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.2822" x="409.7402" y="101.2153">Or attends to another theme connected to skillfulness</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="409.7402" y="116.3481">&#160;</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="372.7402" x="11" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="352.7402" x="21" y="108.4355">Discerns what ideas are fit for attention &amp; attends to them</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="269.9258" x="62.4072" y="192.8164"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.9258" x="72.4072" y="213.9551">Attends to relaxing of thought-fabrication</text><polygon fill="#F1F1F1" points="127.9568,144.4141,266.7834,144.4141,278.7834,156.4141,266.7834,168.4141,127.9568,168.4141,115.9568,156.4141,127.9568,144.4141" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="201.3701" y="178.6245">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.8267" x="127.9568" y="160.2222">Unskillful thoughts arise?</text><polygon fill="#F1F1F1" points="197.3701,246.7852,209.3701,258.7852,197.3701,270.7852,185.3701,258.7852,197.3701,246.7852" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="110.0996" x="142.3203" y="290.7852"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.0996" x="152.3203" y="311.9238">Mind is calmed</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="82.6953" x="156.0225" y="344.7539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="62.6953" x="166.0225" y="365.8926">Joy is born</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="107.2578" x="143.7412" y="398.7227"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="87.2578" x="153.7412" y="419.8613">Rapture arises</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="122.8555" x="135.9424" y="452.6914"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.8555" x="145.9424" y="473.8301">Body grows calm</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="106.9297" x="143.9053" y="506.6602"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86.9297" x="153.9053" y="527.7988">Feels pleasure</text><path d="M312.6855,565.0469 L312.6855,573.6133 L292.6855,577.6133 L312.6855,581.6133 L312.6855,590.1797 A0,0 0 0 0 312.6855,590.1797 L582.2915,590.1797 A0,0 0 0 0 582.2915,590.1797 L582.2915,575.0469 L572.2915,565.0469 L312.6855,565.0469 A0,0 0 0 0 312.6855,565.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M572.2915,565.0469 L572.2915,575.0469 L582.2915,575.0469 L572.2915,565.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.606" x="318.6855" y="582.1138">Plaint, malleable, luminous, not brittle</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="190.6309" x="102.0547" y="560.6289"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.6309" x="112.0547" y="581.7676">Mind becomes concentrated</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.959" x="80.8906" y="614.5977"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.959" x="90.8906" y="635.7363">Knows &amp; sees what has come to be</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="114.6641" x="140.0381" y="668.5664"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="94.6641" x="150.0381" y="689.7051">Is disenchanted</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" widt