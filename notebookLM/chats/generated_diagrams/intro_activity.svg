<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1261px" preserveAspectRatio="none" style="width:684px;height:1261px;background:#FFFFFF;" version="1.1" viewBox="0 0 684 1261" width="684px" zoomAndPan="magnify"><title>Transmigration and the Path to Cessation</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="330.6338" x="175.3989" y="32.9951">Transmigration and the Path to Cessation</text></g><ellipse cx="244.1729" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="166.9414" x="160.7021" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.9414" x="170.7021" y="108.4355">Inconceivable Beginning</text><rect fill="none" height="715.1494" style="stroke:#000000;stroke-width:1.5;" width="605.2822" x="68.1494" y="131.2656"/><path d="M275.9131,131.2656 L275.9131,140.5625 L265.9131,150.5625 L68.1494,150.5625" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.7637" x="71.1494" y="145.2607">The Cycle of Transmigration</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="332.0469" x="78.1494" y="211.5625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="312.0469" x="88.1494" y="232.7012">Beings hindered by ignorance &amp; fettered by craving</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214.8301" x="136.7578" y="265.5313"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.8301" x="146.7578" y="286.6699">Transmigrating &amp; Wandering On</text><path d="M333.6455,309.5 L333.6455,333.1992 L313.6455,337.1992 L333.6455,341.1992 L333.6455,364.8984 A0,0 0 0 0 333.6455,364.8984 L645.4316,364.8984 A0,0 0 0 0 645.4316,364.8984 L645.4316,319.5 L635.4316,309.5 L333.6455,309.5 A0,0 0 0 0 333.6455,309.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M635.4316,309.5 L635.4316,319.5 L645.4316,319.5 L635.4316,309.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.1021" x="339.6455" y="326.5669">This group details the process by which</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.7861" x="339.6455" y="341.6997">new existence arises and perpetuates stress</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.3667" x="339.6455" y="356.8325">within the larger cycle of transmigration.</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="138.9453" x="174.7002" y="320.2148"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="118.9453" x="184.7002" y="341.3535">Recollect Past Lives</text><rect fill="none" height="414.7148" style="stroke:#000000;stroke-width:1.5;" width="286.6328" x="100.8564" y="375.7002"/><path d="M373.7666,375.7002 L373.7666,384.9971 L363.7666,394.9971 L100.8564,394.9971" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.9102" x="103.8564" y="389.6953">Perpetuation of Stress (Complication)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="266.6328" x="110.8564" y="411.9971"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.6328" x="120.8564" y="433.1357">Sustained by or clinging to six properties</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="157.3965" x="165.4746" y="465.9658"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.3965" x="175.4746" y="487.1045">Alighting of an embryo</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="143.6094" x="172.3682" y="528.5713"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="123.6094" x="182.3682" y="549.71">Name-&amp;-Form arises</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="151.0332" x="168.6563" y="582.54"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.0332" x="178.6563" y="603.6787">Six Sense Media arise</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="106.0098" x="191.168" y="636.5088"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86.0098" x="201.168" y="657.6475">Contact arises</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="102.8809" x="192.7324" y="690.4775"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="82.8809" x="202.7324" y="711.6162">Feeling arises</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="133.5137" x="177.416" y="744.4463"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113.5137" x="187.416" y="765.585">Perpetuates Stress</text><polygon fill="#F1F1F1" points="244.1729,167.5625,256.1729,179.5625,244.1729,191.5625,232.1729,179.5625,244.1729,167.5625" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="199.7969,810.415,288.5488,810.415,300.5488,822.415,288.5488,834.415,199.7969,834.415,187.7969,822.415,199.7969,810.415" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="88.752" x="199.7969" y="826.2231">Cycle Continues</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="300.5488" y="819.8208">Yes</text><rect fill="none" height="352.1094" style="stroke:#000000;stroke-width:1.5;" width="466.3457" x="11" y="856.415"/><path d="M232.8662,856.415 L232.8662,865.7119 L222.8662,875.7119 L11,875.7119" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.8662" x="14" y="870.4102">Path to Cessation (Resolution)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="170.8379" x="158.7539" y="892.7119"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.8379" x="168.7539" y="913.8506">One experiencing feeling</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="159.5586" x="164.3936" y="946.6807"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.5586" x="174.3936" y="967.8193">Declare: 'This is Stress'</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.8711" x="109.7373" y="1000.6494"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.8711" x="119.7373" y="1021.7881">Declare: 'This is the Origination of Stress'</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="260.8672" x="113.7393" y="1054.6182"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.8672" x="123.7393" y="1075.7568">Declare: 'This is the Cessation of Stress'</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="446.3457" x="21" y="1108.5869"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="426.3457" x="31" y="1129.7256">Declare: 'This is the Path of Practice leading to the Cessation of Stress'</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="243.0898" x="122.6279" y="1162.5557"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.0898" x="132.6279" y="1183.6943">Achieve complete cessation of stress</text><ellipse cx="244.1729" cy="1239.5244" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="244.1729" cy="1239.5244" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="244.1729" x2="244.1729" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="240.1729,77.2969,244.1729,87.2969,248.1729,77.2969,244.1729,81.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="244.1729" x2="244.1729" y1="245.5313" y2="265.5313"/><polygon fill="#181818" points="240.1729,255.5313,244.1729,265.5313,248.1729,255.5313,244.1729,259.5313" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="244.1729" x2="244.1729" y1="299.5" y2="320.2148"/><polygon fill="#181818" points="240.1729,310.2148,244.1729,320.2148,248.1729,310.2148,244.1729,314.2148" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="244.1729" x2="244.1729" y1="445.9658" y2="465.9658"/><polygon fill="#181818" 